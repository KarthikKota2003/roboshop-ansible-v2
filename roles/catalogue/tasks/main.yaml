- name: Testing variables
  debug:
    name: "trainer is {{trainer}},course is {{course}}"

- name: Application setup for catalogue
  include_role:
    name: common
    tasks_from: app_setup

- name: Nodejs setup for catalogue
  include_role:
    name: common
    tasks_from: nodejs_setup

- name: System setup for catalogue
  include_role:
    name: common
    tasks_from: system_setup

- name: Starting/Restarting catalogue service 
  include_role:
    name: common
    tasks_from: restart

- name: Copying mongo.repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Installing mongodb client
  dnf:
    name: mongodb-mongosh 
    state: present

- name: Check data already loaded or not
  command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_output

- name: Print variable
  debug:
    msg: "{{product_output}}"

- name: Loading data
  shell: mongosh --host "{{ mongodb_host }}" </app/db/master-data.js
  when: product_output.stdout | int == 0 